<html>
    <head>
        <style>
            body{
                background-color: rgb(160, 221, 180);
            }
        #outer{
        min-height: 400px;
        width: 370px;
        background-color: grey;
        border-radius: 10px;
        padding: 25px;
        margin: 100px auto;
        box-sizing: border-box;
        box-shadow: 5px 5px 10px 10px black;
        }
        .display{
            height: 100px;
            width: 320px;
            background-color: antiquewhite;
            border-radius: 8px;
            font-size: 90px;
            text-align: right;
            
            box-shadow: 0px 0px 10px 10px rgb(77, 76, 76) inset ;
         }
         .num{
            height: 80px;
            width: 320px;
            }
            .a{
                height: 60px;
                width: 60px;
                background: rgb(240, 204, 161);
                float: left;
                margin: 10px;
                border-radius: 7px;
                font-size: 60px;
                text-align: center;
                 }
               .bgcolor{
                font-weight: bold;
                background-color: brown;
               }
        </style
    </head>
    <body>
        <h1><font  size="50px" color="purple"><center>Calculator</center></font></h1>
        <div id="outer">
            <div class="display">0</div>
            
            <div class="num">
                <div class="a">7</div>
                <div class="a">8</div>
                <div class="a">9</div>
                <div class="a bgcolor" style="box-shadow: 0px 0px 5px 8px pink inset;">/</div>
            </div>
            
            <div class="num">
                <div class="a">4</div>
                <div class="a">5</div>
                <div class="a">6</div>
                <div class="a bgcolor" style="box-shadow: 0px 0px 5px 8px pink inset;">*</div>
            </div>
            
            <div class="num">
                <div class="a">1</div>
                <div class="a">2</div>
                <div class="a">3</div>
                <div class="a bgcolor" style="box-shadow: 0px 0px 5px 8px pink inset;">+</div>
            </div>
            
            <div class="num">
                <div class="a">0</div>
                <div class="a">.</div>
                <div class="a">=</div>
                <div class="a bgcolor" style="box-shadow: 0px 0px 5px 8px pink inset;">-</div>
            </div>
        </div>
    </body>
</html>
